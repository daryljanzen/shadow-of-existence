# The gate suite, TIERED -- because the suite is not uniform in cost and
# pretending otherwise produces a pipeline nobody waits for.
#
# ** An instrument that cannot finish inside the harness that calls it will be
#    skipped by every caller who does not know that. **  (r2394, learned when
#    run_all_receipts died twice at a tool execution limit.)
name: gates

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'      # nightly: the compile and heavy tiers
    # ⛭ r6977 (66), PO-62: the MONTHLY BACKSTOP.  The two dynamic detectors are to be scoped per
    #   push (node 70's r6975+70.1 measured 13 s and 210 s x 3 builds of compute per push against a
    #   whole sweep's 10,700 s), and a scope is a measurement of ONE tree: a receipt whose reads
    #   change is indexed stale until the next full trace.  ** So the backstop is what keeps the
    #   index honest, and it is not optional to the cadence -- it is the half that catches what the
    #   scope cannot. **  ⌗ *The freeze-out pin makes the case: it was born in the repository's root
    #   commit, so no per-push trigger could ever have seen it, and one full sweep found it.*
    - cron: '0 4 1 * *'      # monthly: the full backstop sweeps, and the read index they refresh
  # ⛭ r4004: `workflow_dispatch` WAS NAMED IN THE HEAVY TIER'S OWN `if:` AND WAS NOT A TRIGGER
  #   HERE, so that arm of the condition could never be true and the receipts tier had exactly
  #   one way to fire: the 03:00 cron.  A job that declares two routes and has one is a job
  #   whose second route nobody can find is missing -- it reads as available and is not.
  workflow_dispatch:

# ⛭ PO-65 (node 70): the repository's default token is read-write; every job here reads only, except
#   the three scoped jobs below, whose record step pushes `refs/ci/carry` (scripts/red_carry.py).
permissions: { contents: read }

jobs:
  fast:
    name: fast — registers, views, IDs
    runs-on: ubuntu-latest
    steps:
      # ** fetch-depth: 0 -- check_branches.py runs `git merge-base --is-ancestor <sha> HEAD`
      #    for every SHA named in FOR_56.md, and the default depth-1 checkout cannot reach a
      #    merged parent, so it false-positives "NOT MERGED" on a commit that IS an ancestor
      #    (b9651f0, r2507's own merge parent). Full history makes the ancestry check truthful. **
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      # ⛭ r6981 (66): the versions come from requirements-ci.txt, which is the environment the
      #   corpus's float comparisons are verified on.  ** An unpinned install moved numpy under
      #   every float in the corpus with no push at all, hours after the fingerprint gate was
      #   wired -- so the pin is what makes a move of the environment a PUSH the scope can see. **
      - run: pip install -r requirements-ci.txt
      # ** r2440: `set -e` REMOVED, AND THE REASON IS A TWELVE-REVISION OUTAGE IT CAUSED. **
      # classify_documents --check began failing at r2427 (twenty-eight restored files, unclassified).
      # Under `set -e` that aborted the step on its FIRST command, so ** the fifteen text gates and the
      # hollow-assertion lint never ran in CI at all ** -- while this line reported "twenty gates rc=0"
      # from running them ONE AT A TIME locally, where every exit code is seen separately.
      # ⇒ ** A suite run by hand and a suite run under `set -e` are different instruments: the first
      #      reports every failure, the second reports the first and hides the rest. **
      # Every check now runs, failures are collected, and the step fails at the END naming all of them.
      - name: the register and view checks
        run: |
          # ** r2692: a stray `; do` sat mid-continuation, opening the for-loop before its list
          # ended, so `bash -n` failed at the real `do` seven lines later.  *** Introduced by
          #     THIS line's gate insertions, not 54's -- cc54 routed it as 54/56's and the
          #     attribution was wrong.  CI was red for everyone. ***
          # ⌷ ** And it was invisible because YAML PARSED FINE: ** the break is inside the
          #   shell string, and every local run types the loop by hand.
          fails=""
          for c in classify_documents regen_teed_up regen_burn_down id_space_census \
                   regen_map_status build_fork_span reapply_annotations \
                   regen_grain_currency regen_work_edge regen_board; do
            echo "── $c"
            python3 scripts/$c.py --check || fails="$fails $c"
          done
          if [ -n "$fails" ]; then echo "⛔ FAILED:$fails"; exit 1; fi
      - name: the text gates
        # r3572 (60): check_compile is listed in BOTH jobs and only ONE of them has a
        # toolchain.  Here it has none, so its compile half is UNRUN -- and UNRUN is not a
        # pass, so the skip is DECLARED here, in writing, naming where the question IS
        # asked.  Without this line the gate exits 2 and says install TeX.  Anything that
        # stops compiling this tree on main must delete this declaration, not keep it.
        # ** ADDITIVE: the gate list below is untouched (CLAIMS.md, r2497). **
        env:
          COMPILE_UNRUN_OK: "the `compile` job below -- texlive-full, on main and on schedule"
        run: |
          fails=""
          for g in check_id_bands check_received_at_weight check_unworked_blockers check_close_names_work check_kills check_burndown check_supersession \
                   check_map_dupes check_grains check_changelog check_depmatrix check_arcs \
                   check_paststate check_receipts check_withdrawn check_queues \
                   check_citations check_absorption check_receipt_exit check_receipt_asserts check_claims check_branches check_deferrals check_routed check_veins check_loaders check_computes check_provenance check_dupes check_ingestion_current check_chirality_qualifier check_absence_pinned check_rerunnable_honest check_stale_unshown check_citations_resolve check_rows_cite_receipts check_delivered_cites_source check_rows_name_the_open check_revisions_logged check_owed_rows_live check_routing_current check_rule_current check_map_overturns check_receipt_verdicts check_lead_framings check_heads_anchored check_leads_follow_rows check_strikes_reported check_cross_row_dupes check_withdrawals_propagate check_superseded_marked check_gap_is_held check_owed_are_tasks check_status_honesty check_gate_currency check_rows_outward check_arc_columns check_register_columns check_row_state check_declared_parts check_family_pointers check_no_stdlib_shadow check_kind check_silent check_withdrawals check_receipt_prefixes check_revleak check_foreign_ontology check_routed_falsehood check_open_ledger check_killrefs \
                   check_conflict_markers check_arcpins check_routed check_veins \
                   check_loci check_loaders check_computes check_provenance \
                   check_revleak check_open_ledger check_killrefs check_compile \
                   check_appendix_current check_currency check_deferrals_resolve check_depth \
                   check_model_ledger check_one_value check_paper_tense check_protected_dupes \
                   check_view_tables check_absence_claims check_pages_current check_frontier_current check_generators_parse check_narration_splice check_knob_shadows check_receipt_home check_receipt_orphans check_receipt_tex_scope check_row_matchers \
                   check_self_certification check_settings check_theatre_currency check_env_fingerprint check_register_monotone check_remainder_chains \
                   check_marker_buried check_landing_rows_trace check_one_state check_prose_pins check_quote_pins check_exact_counts check_cannot_fail check_unread_figure check_revision_collisions check_glyph_coverage check_register_ids check_citation_chain check_source_hygiene check_bibitem_titles check_marker_transposition check_banked_config check_explainer_pins check_order_acknowledged check_figures_shown check_pages_render check_floats_carried; do
            echo "── $g"
            # NODE=ci added r2504+c54.198 (54): check_claims no longer defaults to a REAL node,
            # because a forgetful node was silently impersonating 56 and inheriting its claims.
            # `ci` means: no working tree of its own, and rule (3) swept across EVERY node --
            # the runner is the only place a stale claim is visible and it was checking one of
            # three.  ** This is an ADDITIVE edit: the gate list above is untouched (CLAIMS.md). **
            NODE=ci python3 corpus/$g.py || fails="$fails $g"
          done
          if [ -n "$fails" ]; then echo "⛔ FAILED:$fails"; exit 1; fi
      - name: the hollow-assertion lint
        run: python3 scripts/lint_assertions.py
      # ⛭ r6975 (66): PO-60's cheap detector wired, which is what struck that row's first class from
      #   swept-once to swept-every-push.  ** The vacuous-pin sweep is structural and costs seconds **
      #   -- it parses receipt sources and flags a presence pin whose bare number matches nowhere near
      #   the check's own context -- and it exits non-zero on a flag, so it is a gate and not a census.
      #   ⌗ *The other two detectors are NOT wired here and the reason is their cost, measured rather
      #   than guessed: the runner-read sweep needs an instrumented suite run and the tolerance
      #   perturbation needs three of them, about fifty minutes each.  That cadence is PO-62.*
      - name: the vacuous-pin sweep
        run: python3 scripts/sweep_vacuous_pins.py

  compile:
    name: compile — 17 papers through LaTeX
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      - run: sudo apt-get update && sudo apt-get install -y texlive-full latexmk
      - run: python3 corpus/check_compile.py

  receipts:
    name: heavy — every receipt run where it is registered
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ⛭ r6959 (66): RAISED 45 -> 75, sized from node 70's measurement rather than from the failure.
    #   The suite measured 2380s (39.7 min) at `--jobs 4` with
    #   `P15_the_low_multipole_floor...` KILLED at the 600s cap -- so 5 minutes of margin under a
    #   45-minute job.  That receipt is now declared LONG at 1800s on a measured 1021s standalone,
    #   and the runner does not schedule by declared budget, so in the worst case it starts last and
    #   adds its full 1200s of newly-permitted time to the critical path: 2380 + 1200 = 3580s, or
    #   about 60 minutes.  ⇒ *** A 45-minute job would then fail on the clock rather than on the
    #   tree, which is the same class of defect as a cap that files a receipt as a failure. ***
    #   ⌗ *75 is the worst case plus a quarter, on the rule the LONG declarations use: the measured
    #   figure plus headroom, not a round number chosen to feel safe.*
    timeout-minutes: 75
    steps:
      # ⛔ r6977+70.1 (70): FULL HISTORY.  With the default depth-1 checkout every receipt that reads an
      #   earlier commit (`git show <sha>^`) fails here and passes in any real clone -- the first dispatch
      #   of this job read 791 pass, 80 fail, where a full clone of the same receipts fails only r6975's
      #   two -- and every failure legible in the log is a history read or a commit not fetched.  Never
      #   green under THIS runner: PO-60's second class, one level up.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      # ** THE GAIN THAT ONLY CI CAN GIVE. **  Ten receipts import camb/pynucastro,
      # declared by name in check_receipts_run because the observer container carries
      # neither.  Here they can actually run -- so the fork's own rule, "a registered
      # receipt that does not run where it is registered is not a receipt", becomes
      # checkable EVERYWHERE rather than only where the fork sits.
      # ⛭ r3946: matplotlib added.  Without it P03_the_U3_figure and P03_the_turnaround_figure
      #   fail on import in EVERY environment -- this container and this job alike -- so two
      #   registered receipts were unrunnable everywhere and counted as real failures.
      - run: pip install -r requirements-ci.txt pynucastro
      - run: python3 scripts/run_all_receipts.py --jobs 4 --timeout 600 | tee receipts/RUN_RESULT.txt
      - run: python3 corpus/check_receipts_run.py

  # ===================================================================================================
  backstop:
    name: backstop — the full sweeps, monthly, and the read index they refresh
    # ⛭ r6977 (66), PO-62.  ** Fires only on the monthly cron and by hand **, never on a push: the
    #   whole tolerance sweep is three instrumented suite runs and would quadruple the receipts job.
    #   ⌗ *`github.event.schedule` is how the two crons are told apart; without it this job would fire
    #   nightly and the nightly tier would quietly become four times its measured cost.*
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 1 * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # ⛔ r6977+70.1 (70): FULL HISTORY.  With the default depth-1 checkout every receipt that reads an
      #   earlier commit (`git show <sha>^`) fails here and passes in any real clone -- the first dispatch
      #   of this job read 791 pass, 80 fail, where a full clone of the same receipts fails only r6975's
      #   two -- and every failure legible in the log is a history read or a commit not fetched.  Never
      #   green under THIS runner: PO-60's second class, one level up.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      # ⛔ r6977+70.1: the first dispatch's install failed on an index hiccup, the `always()` steps below
      #   ran anyway without numpy, every receipt died on import, and the tolerance comparison read
      #   "0 flagged" off 871 empty probes.  So: three attempts, and every sweep step requires the install.
      - name: install
        id: install
        shell: bash
        run: for i in 1 2 3; do pip install -r requirements-ci.txt pynucastro && exit 0; sleep 30; done; exit 1
      # ⓵ the cheap structural class, whole -- also wired per push, so this is only a cross-check
      - run: python3 scripts/sweep_vacuous_pins.py
      # ⓶ the runner-read class, whole.  ** This is also what REFRESHES THE READ INDEX **, which is
      #   why the backstop cannot be dropped once the per-push scopes are wired.
      #   ⛭ r6977+70.1 (70): both sweeps were invoked BARE, and bare they print their usage and exit 2 --
      #   so this job would have failed on its first firing having swept nothing.  They take an output
      #   directory (and the tolerance sweep three probes and two comparisons), spelled out below.
      - name: ⓶ the runner-read sweep, whole
        id: reads
        run: python3 scripts/sweep_runner_reads.py --out "$RUNNER_TEMP/trace"
      # ⌗ the index is written from the same trace whether or not the sweep flagged anything -- a flag
      #   is a receipt to repair, not a reason to keep scoping on last month's map.  CI cannot commit, so
      #   the refreshed index is an ARTIFACT: a seat downloads it and commits it as receipts/READ_INDEX.json.
      - name: index — the read index, refreshed from this trace
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: bash
        run: |
          python3 scripts/receipt_scope.py --emit "$RUNNER_TEMP/trace" --index "$RUNNER_TEMP/READ_INDEX.json"
          git diff --no-index --stat receipts/READ_INDEX.json "$RUNNER_TEMP/READ_INDEX.json" || true
      - if: (success() || failure()) && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with: { name: READ_INDEX, path: '${{ runner.temp }}/READ_INDEX.json' }
      # ⓷ the machine-dependent-tolerance class, whole, across the builds that decide round-off.
      #   ⚠ *If this goes red on a build nobody has swept, the remedy is to repair or name what it
      #   flags and THEN refresh receipts/ENV_FINGERPRINT.txt -- never the file alone.*
      - name: ⓷ the tolerance perturbation, whole, on three builds
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: bash
        # ⌗ the environment it swept on is printed FIRST, so a refreshed ENV_FINGERPRINT.txt can be copied
        #   from the log of a sweep that ran on it, and from nothing else.
        run: |
          NODE=ci python3 corpus/check_env_fingerprint.py || true
          T="$RUNNER_TEMP"
          python3 scripts/sweep_tolerances.py --probe "$T/tA"
          python3 scripts/sweep_tolerances.py --probe "$T/tB" --threads 4
          python3 scripts/sweep_tolerances.py --probe "$T/tC" --threads 2 --coretype Prescott
          # ⌗ PO-67 ⓵: the two comparisons' findings are OR-ed bit by bit, not collapsed to 1 --
          #   1 = a site flagged, 2 = a receipt unmeasured, 3 = both; the line below says which.
          rc=0
          python3 scripts/sweep_tolerances.py --compare "$T/tA" "$T/tB" || rc=$(( rc | $? ))
          python3 scripts/sweep_tolerances.py --compare "$T/tA" "$T/tC" || rc=$(( rc | $? ))
          case $rc in
            0) echo "  VERDICT (both comparisons): CLEAN" ;;
            1) echo "  VERDICT (both comparisons): FLAGGED -- every receipt was measured" ;;
            2) echo "  VERDICT (both comparisons): NOT A SWEEP -- nothing flagged, a receipt unmeasured" ;;
            *) echo "  VERDICT (both comparisons): FLAGGED AND NOT A SWEEP" ;;
          esac
          exit $rc
      # ⓸ THE MUTATION CLASS, WHOLE -- the two DYNAMIC operators of node 70's instrument (r7113+70.1,
      #   coverage closed at r7119+70.1).  ⛔ *They are HERE and not in the fast list for a measured reason:
      #   each costs one receipt run per site, which is the tolerance sweep's own shape above and cannot fit
      #   the fast job's 420s per-gate budget.  A gate placed where it cannot finish reports the clock
      #   instead of the tree.*  ⌗ *The two STATIC operators are a different cost -- 26s and 4s -- and are
      #   wired per push as `check_prose_pins` and `check_quote_pins`.*
      #
      #   ⛭⛭ *`check_unread_figure` registered r7153 (66) on node 70's `r7151+70.1` draft --- **the fifth
      #   operator of the mutation family, and the SECOND gate registered against this seat's own
      #   report-grade recommendation.**  70 declined to ratchet for two reasons and both are answered
      #   rather than discounted: *precision was `10` of `20` on the class as it worded it, but that figure
      #   separates a FIGURE from a hard-coded FORMULA and both are the same defect --- a label attributing
      #   a quantity to a text the receipt never opens --- so on the defect it is `16` of `20`*; and *the
      #   drift partition fails its chance control at `86.5` per cent, which governs PRIORITY inside the
      #   class and not whether to hold it, exactly as `UBIQUITOUS-ARM` sits reported-not-enforced inside
      #   the cannot-fail baseline.*  ⌈ **And the partition the ratchet keys on is not a precision question
      #   at all: a receipt either NAMES the paper or it does not.**  ⇒ *`NO-READ` is gated at a ceiling of
      #   `50`, `READS-PAPER` is carried reported-not-enforced, and the ceiling is written from what the
      #   operator read on the tree it was registered against --- `53` in 70's draft, `50` here, because the
      #   gate repaired its own receipt first and the three sites that routed the class no longer exist.*
      #
      #   ⛭ *`check_cannot_fail` registered r7143 (66) on node 70's `r7141+70.1` draft, which 70 called
      #   report-grade and left the gating call here.  ** Registered against that recommendation, and the
      #   reason 70 gave is answered rather than overridden: ** its grounds were `T2` over-firing and the
      #   vacuous arm being statically unreachable.  `T2` is now adjudicated as a named class,
      #   `SCOPE-AS-CHECK`, with a one-line repair (print the scope, do not check it), and
      #   `UBIQUITOUS-ARM` sits in the baseline reported-not-enforced exactly as `TILT`'s `REGRID` does.
      #   ⌗ *`94` sites under `61` counted keys, `71` owed, `21.7`s.  **It is the RAREST of the four
      #   assertion classes, not the commonest** -- `51` of `956` receipts -- and this seat's `r7139`
      #   sentence claiming otherwise is corrected in `PO-78`.*  ⌗ *All four of its `TRIVIAL-ENV` sites
      #   were in this seat's own two receipts and were repaired at `r7141` before the gate was
      #   registered, which is why that class is empty here.*
      #
      #   ⛭ *`check_quote_pins` registered r7127 (66) on node 70's `r7125+70.1` build: the QUOTE-PIN
      #   operator, a pin on the PRESENCE of a sentence another seat owns.  It runs in 4s on 2,299 keys, so
      #   the fast list is where its cost puts it.  ** Its backlog of 2,287 is the largest of the three and
      #   stands in the open with its own register row rather than as exemptions. **  ⌗ The class is not new:
      #   `L-249` named it at `r3105` after nine pin-breaks and left its gate owed, which is the oldest
      #   unbuilt instrument the sweep has turned up.*
      #
      #   ** Each is a RATCHET over a baseline of adjudications, not a pass/fail on the backlog: ** it fails
      #   on a site not in its baseline, on a baseline entry no longer reported, and on any rise in the owed
      #   count.  *A gate that went red on a whole standing class at once would be switched off, and the
      #   class would go back to being caught by hand -- which is how all four of its founding instances
      #   were found.*
      - name: ⓸ the mutation class, whole -- TILT as a ratchet, REGRID and ROUNDING-BOUNDARY as reports
        if: (success() || failure()) && steps.install.outcome == 'success'
        shell: bash
        run: |
          rc=0
          NODE=ci python3 corpus/check_tilt_pins.py || rc=$(( rc | 1 ))
          # ⛭⛭ ROUNDING-BOUNDARY runs here as a REPORT r7155 (66), on node 70's `r7153+70.1` measurement
          #   and on THIS JOB'S OWN STANDING RULING rather than a new one.  *The class is a comparison whose
          #   verdict is decided by a rounding boundary rather than by the quantity -- `round(E, n) == L`, or
          #   a band of half a unit in the literal's own last printed digit.*  ** 35 static sites in 22
          #   receipts, 33 HALF-UNIT and 2 ROUND; the dynamic half wraps each site's operand and records its
          #   distance to the flipping boundary, 22 receipts in 154s. **  ⌈ Recall is 1 of 1 on the one known
          #   instance: the pre-r7153 `P15_the_exact_transmission_ratios...` is flagged ON-BOUNDARY with its
          #   closest execution 7.5e-4 of a unit from the midpoint, which is the `ell = 2` straddle found
          #   mechanically rather than by hand.
          #   ⇒ *But ON THE CURRENT TREE NO EXECUTION IS ON A BOUNDARY -- the smallest margins are 0.031,
          #   0.033, 0.045 and 0.048 of a unit, every one at least thirty times the threshold.*  ** So its
          #   baseline would be empty, and an empty baseline is a gate asserting an absence -- which is
          #   exactly why REGRID sits here as a report below. **  ⌈ Same shape, same ruling: it runs, its
          #   exit status is RECORDED and not enforced, and it earns a ratchet when it has a second finding.
          #   ⛔ *And what it does not see is stated rather than left to be discovered: a half-unit band whose
          #   centre is a NAME rather than a literal is outside the pre-registered form, which includes the
          #   `r7153` repair of the four non-boundary ratios as that repair is written.*
          NODE=ci python3 scripts/mutate_assertions.py --rounding-boundary || true
          # ⌗ REGRID has no ratchet yet: its one live finding (C63's check 2) was repaired at r7119+cc66.90
          #   by DERIVING the window from the abscissa, so its baseline would be empty -- and an empty
          #   baseline is a gate asserting an absence.  It runs here as a REPORT until it has a second
          #   finding to ratchet against, and its exit status is recorded rather than enforced.
          NODE=ci python3 scripts/mutate_assertions.py \
            --regrid computations/beyond_the_wall/r7113_70_mutation_instrument/regrid_list.txt \
            "$RUNNER_TEMP/regrid" --regrid-dir down || echo "  REGRID: reported, not enforced (see above)"
          exit $rc

  # ===================================================================================================
  # ⛭ r6977+70.1 (node 70), PO-62: THE THREE SCOPED JOBS -- each detector run on exactly the receipts
  #   this push, or this PR, can have changed.  ** Scoping runs the SAME detector on FEWER receipts; a
  #   receipt outside the scope is one whose source, reads, imports and globs the range did not touch. **
  #
  #   ⌗ WHAT IS SCOPED, PER EVENT.  push: exactly the commits pushed (`before..after`), so the check on a
  #     commit is about that push.  pull_request: the whole PR against its base -- what merging it
  #     brings -- so a later push that is green cannot hide an earlier red one on the same PR.  A branch
  #     with an open PR therefore pays both, and the cost below is per event.
  #   ⌗ THE INDEX, AND WHAT HAPPENS WHEN IT IS STALE.  The scope is read from receipts/READ_INDEX.json,
  #     one full trace of the suite, committed.  ** It is REFRESHED by the monthly `backstop` job below **
  #     (its `index` step writes a new one as an artifact; a seat commits it).  A receipt edited since
  #     the trace is scoped on its traced reads PLUS its current source's names and imports; a receipt
  #     added since, on the latter alone -- both counts are printed by every scope step.  ** And the
  #     whole index EXPIRES 35 days after the commit it was traced at: every scoped job then FAILS and
  #     names the remedy, rather than scoping on a map of a tree that has moved on. **
  #   ⌗ A push that touches nothing any receipt reads runs NOTHING: the scope step prints 0, and the
  #     steps that install and run are skipped, so such a push costs a checkout and a `git diff`.
  scope-suite:
    name: scoped — the plain suite, on what this push can have changed
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions: { contents: write }   # PO-65: the record step pushes refs/ci/carry, and nothing else
    runs-on: ubuntu-latest
    # ⌗ COST, measured (receipt_scope.py --replay 400 against the r6977 index, main's first-parent
    #   pushes 09-12..09-28): 90 receipts at the median, 184 at p90, 397 at most; 1,547 s of
    #   compute at the mean (about 7 minutes of wall at four jobs), 3,598 s at p90, 6,562 s at most; 7 of 400
    #   pushes had nothing in scope.  Worst case is the whole suite, which
    #   the heavy job below runs in ~50 minutes on the same four jobs -- hence the same 75.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      - name: scope — which receipts this range can have changed
        id: scope
        shell: bash
        run: |
          python3 scripts/receipt_scope.py --ci --scope suite --list "$RUNNER_TEMP/scope.txt"
          python3 scripts/red_carry.py --union suite --list "$RUNNER_TEMP/scope.txt"
          echo "n=$(wc -l < "$RUNNER_TEMP/scope.txt")" >> "$GITHUB_OUTPUT"
          sed 's/^/    /' "$RUNNER_TEMP/scope.txt"
      - name: nothing in scope — nothing runs
        if: steps.scope.outputs.n == '0'
        run: echo "0 receipts in the suite scope of this range -- nothing to run, and nothing was."
      # ⌗ three attempts: at r6977+70.1 one run's index answered "camb (from versions: none)" while the
      #   PR run of the same commit installed it in 19 s.  A package that is really gone fails all three.
      - if: steps.scope.outputs.n != '0'
        shell: bash
        run: for i in 1 2 3; do pip install -r requirements-ci.txt pynucastro && exit 0; sleep 30; done; exit 1
      - name: run the scoped receipts, as the runner runs every receipt
        id: run
        if: steps.scope.outputs.n != '0'
        shell: bash
        # ⛔ `SLOW` is not a pass here either: the verdict must read `0 fail, 0 over timeout`.
        run: |
          python3 scripts/run_all_receipts.py --from "$RUNNER_TEMP/scope.txt" --jobs 4 --timeout 600 \
            | tee "$RUNNER_TEMP/scoped_result.txt"
          grep -Eq '^  [0-9]+ pass, 0 fail, 0 over timeout' "$RUNNER_TEMP/scoped_result.txt"

      # ⛭ PO-65: whatever happened above, write it down.  A receipt this run covered and passed leaves
      #   the carry; a red one joins it; a failure that names nothing carries the whole scope.
      - name: record — carry this push's reds forward, clear what it ran green
        if: always() && steps.scope.outcome == 'success'
        shell: bash
        run: python3 scripts/red_carry.py --record suite --list "$RUNNER_TEMP/scope.txt" --outcome "${{ steps.run.outcome }}" --suite-log "$RUNNER_TEMP/scoped_result.txt"

  scope-reads:
    name: scoped — the runner-read sweep, on what this push deleted or renamed
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions: { contents: write }   # PO-65: the record step pushes refs/ci/carry, and nothing else
    runs-on: ubuntu-latest
    # ⌗ COST, measured as above: 0 receipts at the median, 1 at p90, 152 at most; 19 s of compute at the
    #   mean; 265 of 400 pushes had nothing in scope.
    #   Scope: a receipt that changed, or one whose read or glob hit a path the range DELETED or RENAMED.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      - name: scope — which receipts this range can have made read nothing
        id: scope
        shell: bash
        run: |
          python3 scripts/receipt_scope.py --ci --scope reads --list "$RUNNER_TEMP/scope.txt"
          python3 scripts/red_carry.py --union reads --list "$RUNNER_TEMP/scope.txt"
          echo "n=$(wc -l < "$RUNNER_TEMP/scope.txt")" >> "$GITHUB_OUTPUT"
          sed 's/^/    /' "$RUNNER_TEMP/scope.txt"
      - name: nothing in scope — nothing runs
        if: steps.scope.outputs.n == '0'
        run: echo "0 receipts in the reads scope of this range -- nothing to run, and nothing was."
      # ⌗ three attempts: at r6977+70.1 one run's index answered "camb (from versions: none)" while the
      #   PR run of the same commit installed it in 19 s.  A package that is really gone fails all three.
      - if: steps.scope.outputs.n != '0'
        shell: bash
        run: for i in 1 2 3; do pip install -r requirements-ci.txt pynucastro && exit 0; sleep 30; done; exit 1
      - name: trace the scoped receipts from their own directories
        id: run
        if: steps.scope.outputs.n != '0'
        run: python3 scripts/sweep_runner_reads.py --out "$RUNNER_TEMP/trace" --from "$RUNNER_TEMP/scope.txt"

      # ⛭ PO-65: whatever happened above, write it down.  A receipt this run covered and passed leaves
      #   the carry; a red one joins it; a failure that names nothing carries the whole scope.
      - name: record — carry this push's reds forward, clear what it ran green
        if: always() && steps.scope.outcome == 'success'
        shell: bash
        run: python3 scripts/red_carry.py --record reads --list "$RUNNER_TEMP/scope.txt" --outcome "${{ steps.run.outcome }}" --trace "$RUNNER_TEMP/trace"

  scope-tolerance:
    name: scoped — the tolerance perturbation, on code and data this push changed
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions: { contents: write }   # PO-65: the record step pushes refs/ci/carry, and nothing else
    runs-on: ubuntu-latest
    # ⌗ COST, measured as above: 5 receipts at the median, 40 at p90, 232 at most; 674 s at the
    #   mean, 1,539 s at p90; 87 of 400 pushes had nothing in scope.  Three probes of the same receipts
    #   (the runner's one thread; four threads; the Prescott kernel at two), so a scope costs three
    #   times its receipts' time.  Worst case measured: 5,937 s x 3, about 75 minutes at four jobs, hence 120.
    #   Scope: a receipt that changed, or code or data it reads, imports or names -- never prose.
    #   ⚠ The ENVIRONMENT is not in any diff: that half of the class is `check_env_fingerprint` in the
    #   fast job and the whole sweep in `backstop`.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      - name: scope — which receipts this range's code and data can have moved
        id: scope
        shell: bash
        run: |
          python3 scripts/receipt_scope.py --ci --scope tolerance --list "$RUNNER_TEMP/scope.txt"
          python3 scripts/red_carry.py --union tolerance --list "$RUNNER_TEMP/scope.txt"
          echo "n=$(wc -l < "$RUNNER_TEMP/scope.txt")" >> "$GITHUB_OUTPUT"
          sed 's/^/    /' "$RUNNER_TEMP/scope.txt"
      - name: nothing in scope — nothing runs
        if: steps.scope.outputs.n == '0'
        run: echo "0 receipts in the tolerance scope of this range -- nothing to run, and nothing was."
      # ⌗ three attempts: at r6977+70.1 one run's index answered "camb (from versions: none)" while the
      #   PR run of the same commit installed it in 19 s.  A package that is really gone fails all three.
      - if: steps.scope.outputs.n != '0'
        shell: bash
        run: for i in 1 2 3; do pip install -r requirements-ci.txt pynucastro && exit 0; sleep 30; done; exit 1
      - name: probe on three builds, compare each with the runner's
        id: run
        if: steps.scope.outputs.n != '0'
        shell: bash
        # ⌗ A site judged FALSE is passed only while its receipt's blob is the one it was judged on
        #   (receipts/TOLERANCE_JUDGED.json); a FLIP is never passed.  Both comparisons always run.
        run: |
          L="$RUNNER_TEMP/scope.txt"; T="$RUNNER_TEMP"
          python3 scripts/sweep_tolerances.py --probe "$T/tA" --from "$L"
          python3 scripts/sweep_tolerances.py --probe "$T/tB" --from "$L" --threads 4
          python3 scripts/sweep_tolerances.py --probe "$T/tC" --from "$L" --threads 2 --coretype Prescott
          # ⌗ PO-67 ⓵: the two comparisons' findings are OR-ed bit by bit, not collapsed to 1 --
          #   1 = a site flagged, 2 = a receipt unmeasured, 3 = both; the line below says which.
          rc=0
          python3 scripts/sweep_tolerances.py --compare "$T/tA" "$T/tB" || rc=$(( rc | $? ))
          python3 scripts/sweep_tolerances.py --compare "$T/tA" "$T/tC" || rc=$(( rc | $? ))
          case $rc in
            0) echo "  VERDICT (both comparisons): CLEAN" ;;
            1) echo "  VERDICT (both comparisons): FLAGGED -- every receipt was measured" ;;
            2) echo "  VERDICT (both comparisons): NOT A SWEEP -- nothing flagged, a receipt unmeasured" ;;
            *) echo "  VERDICT (both comparisons): FLAGGED AND NOT A SWEEP" ;;
          esac
          exit $rc

      # ⛭ PO-65: whatever happened above, write it down.  A receipt this run covered and passed leaves
      #   the carry; a red one joins it; a failure that names nothing carries the whole scope.
      - name: record — carry this push's reds forward, clear what it ran green
        if: always() && steps.scope.outcome == 'success'
        shell: bash
        run: python3 scripts/red_carry.py --record tolerance --list "$RUNNER_TEMP/scope.txt" --outcome "${{ steps.run.outcome }}" --tol-dirs "$RUNNER_TEMP/tA" "$RUNNER_TEMP/tB" "$RUNNER_TEMP/tC"
