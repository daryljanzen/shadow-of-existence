# The gate suite, TIERED -- because the suite is not uniform in cost and
# pretending otherwise produces a pipeline nobody waits for.
#
# ** An instrument that cannot finish inside the harness that calls it will be
#    skipped by every caller who does not know that. **  (r2394, learned when
#    run_all_receipts died twice at a tool execution limit.)
name: gates

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'      # nightly: the compile and heavy tiers
    # ⛭ r6977 (66), PO-62: the MONTHLY BACKSTOP.  The two dynamic detectors are to be scoped per
    #   push (node 70's r6975+70.1 measured 13 s and 210 s x 3 builds of compute per push against a
    #   whole sweep's 10,700 s), and a scope is a measurement of ONE tree: a receipt whose reads
    #   change is indexed stale until the next full trace.  ** So the backstop is what keeps the
    #   index honest, and it is not optional to the cadence -- it is the half that catches what the
    #   scope cannot. **  ⌗ *The freeze-out pin makes the case: it was born in the repository's root
    #   commit, so no per-push trigger could ever have seen it, and one full sweep found it.*
    - cron: '0 4 1 * *'      # monthly: the full backstop sweeps, and the read index they refresh
  # ⛭ r4004: `workflow_dispatch` WAS NAMED IN THE HEAVY TIER'S OWN `if:` AND WAS NOT A TRIGGER
  #   HERE, so that arm of the condition could never be true and the receipts tier had exactly
  #   one way to fire: the 03:00 cron.  A job that declares two routes and has one is a job
  #   whose second route nobody can find is missing -- it reads as available and is not.
  workflow_dispatch:

jobs:
  fast:
    name: fast — registers, views, IDs
    runs-on: ubuntu-latest
    steps:
      # ** fetch-depth: 0 -- check_branches.py runs `git merge-base --is-ancestor <sha> HEAD`
      #    for every SHA named in FOR_56.md, and the default depth-1 checkout cannot reach a
      #    merged parent, so it false-positives "NOT MERGED" on a commit that IS an ancestor
      #    (b9651f0, r2507's own merge parent). Full history makes the ancestry check truthful. **
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy scipy sympy mpmath
      # ** r2440: `set -e` REMOVED, AND THE REASON IS A TWELVE-REVISION OUTAGE IT CAUSED. **
      # classify_documents --check began failing at r2427 (twenty-eight restored files, unclassified).
      # Under `set -e` that aborted the step on its FIRST command, so ** the fifteen text gates and the
      # hollow-assertion lint never ran in CI at all ** -- while this line reported "twenty gates rc=0"
      # from running them ONE AT A TIME locally, where every exit code is seen separately.
      # ⇒ ** A suite run by hand and a suite run under `set -e` are different instruments: the first
      #      reports every failure, the second reports the first and hides the rest. **
      # Every check now runs, failures are collected, and the step fails at the END naming all of them.
      - name: the register and view checks
        run: |
          # ** r2692: a stray `; do` sat mid-continuation, opening the for-loop before its list
          # ended, so `bash -n` failed at the real `do` seven lines later.  *** Introduced by
          #     THIS line's gate insertions, not 54's -- cc54 routed it as 54/56's and the
          #     attribution was wrong.  CI was red for everyone. ***
          # ⌷ ** And it was invisible because YAML PARSED FINE: ** the break is inside the
          #   shell string, and every local run types the loop by hand.
          fails=""
          for c in classify_documents regen_teed_up regen_burn_down id_space_census \
                   regen_map_status build_fork_span reapply_annotations \
                   regen_grain_currency regen_work_edge regen_board; do
            echo "── $c"
            python3 scripts/$c.py --check || fails="$fails $c"
          done
          if [ -n "$fails" ]; then echo "⛔ FAILED:$fails"; exit 1; fi
      - name: the text gates
        # r3572 (60): check_compile is listed in BOTH jobs and only ONE of them has a
        # toolchain.  Here it has none, so its compile half is UNRUN -- and UNRUN is not a
        # pass, so the skip is DECLARED here, in writing, naming where the question IS
        # asked.  Without this line the gate exits 2 and says install TeX.  Anything that
        # stops compiling this tree on main must delete this declaration, not keep it.
        # ** ADDITIVE: the gate list below is untouched (CLAIMS.md, r2497). **
        env:
          COMPILE_UNRUN_OK: "the `compile` job below -- texlive-full, on main and on schedule"
        run: |
          fails=""
          for g in check_id_bands check_received_at_weight check_unworked_blockers check_close_names_work check_kills check_burndown check_supersession \
                   check_map_dupes check_grains check_changelog check_depmatrix check_arcs \
                   check_paststate check_receipts check_withdrawn check_queues \
                   check_citations check_absorption check_receipt_exit check_receipt_asserts check_claims check_branches check_deferrals check_routed check_veins check_loaders check_computes check_provenance check_dupes check_ingestion_current check_chirality_qualifier check_absence_pinned check_rerunnable_honest check_stale_unshown check_citations_resolve check_rows_cite_receipts check_delivered_cites_source check_rows_name_the_open check_revisions_logged check_owed_rows_live check_routing_current check_rule_current check_map_overturns check_receipt_verdicts check_lead_framings check_heads_anchored check_leads_follow_rows check_strikes_reported check_cross_row_dupes check_withdrawals_propagate check_superseded_marked check_gap_is_held check_owed_are_tasks check_status_honesty check_gate_currency check_rows_outward check_arc_columns check_register_columns check_row_state check_declared_parts check_family_pointers check_no_stdlib_shadow check_kind check_silent check_withdrawals check_receipt_prefixes check_revleak check_foreign_ontology check_routed_falsehood check_open_ledger check_killrefs \
                   check_conflict_markers check_arcpins check_routed check_veins \
                   check_loci check_loaders check_computes check_provenance \
                   check_revleak check_open_ledger check_killrefs check_compile \
                   check_appendix_current check_currency check_deferrals_resolve check_depth \
                   check_model_ledger check_one_value check_paper_tense check_protected_dupes \
                   check_view_tables check_absence_claims check_pages_current check_frontier_current check_generators_parse check_narration_splice check_knob_shadows check_receipt_home check_receipt_orphans check_receipt_tex_scope check_row_matchers \
                   check_self_certification check_settings check_theatre_currency check_env_fingerprint \
                   check_marker_buried check_landing_rows_trace check_one_state check_revision_collisions check_glyph_coverage check_register_ids check_citation_chain check_source_hygiene check_bibitem_titles; do
            echo "── $g"
            # NODE=ci added r2504+c54.198 (54): check_claims no longer defaults to a REAL node,
            # because a forgetful node was silently impersonating 56 and inheriting its claims.
            # `ci` means: no working tree of its own, and rule (3) swept across EVERY node --
            # the runner is the only place a stale claim is visible and it was checking one of
            # three.  ** This is an ADDITIVE edit: the gate list above is untouched (CLAIMS.md). **
            NODE=ci python3 corpus/$g.py || fails="$fails $g"
          done
          if [ -n "$fails" ]; then echo "⛔ FAILED:$fails"; exit 1; fi
      - name: the hollow-assertion lint
        run: python3 scripts/lint_assertions.py
      # ⛭ r6975 (66): PO-60's cheap detector wired, which is what struck that row's first class from
      #   swept-once to swept-every-push.  ** The vacuous-pin sweep is structural and costs seconds **
      #   -- it parses receipt sources and flags a presence pin whose bare number matches nowhere near
      #   the check's own context -- and it exits non-zero on a flag, so it is a gate and not a census.
      #   ⌗ *The other two detectors are NOT wired here and the reason is their cost, measured rather
      #   than guessed: the runner-read sweep needs an instrumented suite run and the tolerance
      #   perturbation needs three of them, about fifty minutes each.  That cadence is PO-62.*
      - name: the vacuous-pin sweep
        run: python3 scripts/sweep_vacuous_pins.py

  compile:
    name: compile — 17 papers through LaTeX
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y texlive-full latexmk
      - run: python3 corpus/check_compile.py

  receipts:
    name: heavy — every receipt run where it is registered
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # ⛭ r6959 (66): RAISED 45 -> 75, sized from node 70's measurement rather than from the failure.
    #   The suite measured 2380s (39.7 min) at `--jobs 4` with
    #   `P15_the_low_multipole_floor...` KILLED at the 600s cap -- so 5 minutes of margin under a
    #   45-minute job.  That receipt is now declared LONG at 1800s on a measured 1021s standalone,
    #   and the runner does not schedule by declared budget, so in the worst case it starts last and
    #   adds its full 1200s of newly-permitted time to the critical path: 2380 + 1200 = 3580s, or
    #   about 60 minutes.  ⇒ *** A 45-minute job would then fail on the clock rather than on the
    #   tree, which is the same class of defect as a cap that files a receipt as a failure. ***
    #   ⌗ *75 is the worst case plus a quarter, on the rule the LONG declarations use: the measured
    #   figure plus headroom, not a round number chosen to feel safe.*
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # ** THE GAIN THAT ONLY CI CAN GIVE. **  Ten receipts import camb/pynucastro,
      # declared by name in check_receipts_run because the observer container carries
      # neither.  Here they can actually run -- so the fork's own rule, "a registered
      # receipt that does not run where it is registered is not a receipt", becomes
      # checkable EVERYWHERE rather than only where the fork sits.
      # ⛭ r3946: matplotlib added.  Without it P03_the_U3_figure and P03_the_turnaround_figure
      #   fail on import in EVERY environment -- this container and this job alike -- so two
      #   registered receipts were unrunnable everywhere and counted as real failures.
      - run: pip install numpy scipy sympy mpmath camb pynucastro matplotlib
      - run: python3 scripts/run_all_receipts.py --jobs 4 --timeout 600 | tee receipts/RUN_RESULT.txt
      - run: python3 corpus/check_receipts_run.py

  # ===================================================================================================
  backstop:
    name: backstop — the full sweeps, monthly, and the read index they refresh
    # ⛭ r6977 (66), PO-62.  ** Fires only on the monthly cron and by hand **, never on a push: the
    #   whole tolerance sweep is three instrumented suite runs and would quadruple the receipts job.
    #   ⌗ *`github.event.schedule` is how the two crons are told apart; without it this job would fire
    #   nightly and the nightly tier would quietly become four times its measured cost.*
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 1 * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy scipy sympy mpmath camb pynucastro matplotlib
      # ⓵ the cheap structural class, whole -- also wired per push, so this is only a cross-check
      - run: python3 scripts/sweep_vacuous_pins.py
      # ⓶ the runner-read class, whole.  ** This is also what REFRESHES THE READ INDEX **, which is
      #   why the backstop cannot be dropped once the per-push scopes are wired.
      - run: python3 scripts/sweep_runner_reads.py
      # ⓷ the machine-dependent-tolerance class, whole, across the builds that decide round-off.
      #   ⚠ *If this goes red on a build nobody has swept, the remedy is to repair or name what it
      #   flags and THEN refresh receipts/ENV_FINGERPRINT.txt -- never the file alone.*
      - run: python3 scripts/sweep_tolerances.py
