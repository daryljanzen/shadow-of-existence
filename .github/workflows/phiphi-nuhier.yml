# ⛭ `r7885` (69): 60's lensing grid with the neutrino hierarchy on (`r7884`, `gen_phiphi_nuhier.sh`), built on
#   GitHub runners because 60's container is replaced about every ninety minutes and one point costs
#   ~35 min of wall on four cores (2h16m of CPU) with no checkpoint (`r7884`'s COST.md).  Banked to
#   `refs/ci/r7884_phiphi`.
#
# Modelled on `dlk.yml`, for the same three reasons:
#   ⒜ its own concurrency group, and it does NOT cancel in progress: a later push to the branch must not
#      kill a point that is an hour in;
#   ⒝ it is outside `gates.yml`, so it is never charged to the nightly's budget;
#   ⒞ a push path filter on a LAUNCH file, restricted to the launching branch, plus a job-level `if:` on
#      that ref -- so no seat's merge of main can relaunch it or move the ref.
#
# ⚑ ONE MATRIX JOB PER POINT, each at JOBS=1, through 60's generator UNCHANGED (`run_point.sh` seeds the other
#   points as placeholders, which the generator's own idempotence skips, and removes them after).
# ⛔ THE PROVENANCE GATE IS A REFUSAL, NOT A WARNING.  `gate.py` reads the expected switches, arm numbers and
#   sum nodes OFF THE GENERATOR, and refuses a point whose own recorded config differs; where the repository
#   already banks the point (60's container ran lcdm_S006 and lcdm_S015) it is also the cross-machine control,
#   refusing above 1e-6 relative.  It runs in every point job and again in the bank job.
# ⌗ The timeout is set from the first point's measured cost: lcdm_S006 took 34m29s of wall on ~3.95 cores in
#   the container.  The runner has four cores and has run 1.0-1.7x the container's time on the nightlies, so a
#   point is expected at 35-60 min; 150 min is 2.5x the slow end and well under the 6-hour job limit.
name: phiphi-nuhier — r7884 lensing grid with the hierarchy on, to refs/ci/r7884_phiphi

on:
  push:
    branches: [claude/shadow-of-existence-setup-wgcmvt]
    paths:
      - 'computations/beyond_the_wall/r7885_70_phiphi_runner/LAUNCH'
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: phiphi-nuhier-${{ github.ref }}
  cancel-in-progress: false

env:
  D: computations/beyond_the_wall/r7885_70_phiphi_runner

jobs:
  point:
    if: github.ref == 'refs/heads/claude/shadow-of-existence-setup-wgcmvt'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        # ⌗ the generator's own list (`gate.py --list`); the bank job refuses unless every one is accounted for.
        point: [lcdm_S006, lcdm_S015, lcdm_S030, lcdm_S045, lcdm_S060,
                cr_S006, cr_S015, cr_S030, cr_S045, cr_S060]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt (PO-64)
      - run: pip install -r requirements-ci.txt
      - name: the point, through 60's generator at JOBS=1
        shell: bash
        run: |
          set -euo pipefail
          arm=${{ matrix.point }}; tag=${arm#*_}; arm=${arm%%_*}
          bash "$D/run_point.sh" "$arm" "$tag" "$RUNNER_TEMP/pp"
      - name: the provenance gate, on this runner
        shell: bash
        run: |
          arm=${{ matrix.point }}; tag=${arm#*_}; arm=${arm%%_*}
          python3 "$D/gate.py" --check "$RUNNER_TEMP/pp" "$arm" "$tag"
      - name: the record, its timing and its log, as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pp-${{ matrix.point }}
          path: |
            ${{ runner.temp }}/pp/${{ matrix.point }}.json
            ${{ runner.temp }}/pp/${{ matrix.point }}.timing.json
            ${{ runner.temp }}/pp/${{ matrix.point }}.log
          if-no-files-found: warn
          retention-days: 30

  bank:
    needs: point
    if: always() && github.ref == 'refs/heads/claude/shadow-of-existence-setup-wgcmvt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write }   # only the push step writes, and only refs/ci/r7884_phiphi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }
      - uses: actions/download-artifact@v4
        with: { path: '${{ runner.temp }}/art', pattern: 'pp-*', merge-multiple: true }
      - name: the gate over every point, and the manifest
        id: gate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/art"
          python3 "$D/gate.py" --manifest "$RUNNER_TEMP/art"; echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: the points that passed, their provenance and the manifest -- refs/ci/r7884_phiphi
        shell: bash
        env:
          GIT_AUTHOR_NAME: phiphi-nuhier
          GIT_AUTHOR_EMAIL: phiphi-nuhier@users.noreply.github.com
          GIT_COMMITTER_NAME: phiphi-nuhier
          GIT_COMMITTER_EMAIL: phiphi-nuhier@users.noreply.github.com
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/art"
          passed=$(python3 -c "import json;m=json.load(open('$a/MANIFEST.json'));print(' '.join(k for k,v in sorted(m.items()) if v['ok']))")
          [ -n "$passed" ] || { echo "no point passed the gate -- nothing banked"; exit 1; }
          entries=$(printf '100644 blob %s\tMANIFEST.json\n' "$(git hash-object -w "$a/MANIFEST.json")")
          for p in $passed; do
            for f in "$p.json" "$p.timing.json"; do
              entries+=$'\n'$(printf '100644 blob %s\t%s' "$(git hash-object -w "$a/$f")" "$f")
            done
          done
          tree=$(printf '%s\n' "$entries" | git mktree)
          commit=$(git commit-tree "$tree" -m "r7884 lensing grid, hierarchy on: $(echo $passed | wc -w) point(s) gated, run ${{ github.run_id }} at ${{ github.sha }}")
          git push -f origin "$commit:refs/ci/r7884_phiphi"
          echo "banked: $passed"
          echo "fetch it with:  git fetch origin refs/ci/r7884_phiphi && git show FETCH_HEAD:MANIFEST.json"
      - name: every point of the generator accounted for
        shell: bash
        run: '[ "${{ steps.gate.outputs.rc }}" = "0" ] || { echo "not every point passed -- see MANIFEST.json on refs/ci/r7884_phiphi"; exit 1; }'
