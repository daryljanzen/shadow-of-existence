# ⛭ `r7739` (69): the two x0(eta) arrays and the two eta grids, to refs/ci/r7737_grid (PREDICTION ⑥ in
#   computations/beyond_the_wall/r7737_70_dlk_split/), so cc66 can compute S1 and bound index pairing.
# On dlk.yml's pattern: a push path filter on its own LAUNCH file restricted to the launching branch, a job-level
#   `if:` on that ref, no cancel-in-progress, and every closure a refusal.  It is GRIDSAVE only: seconds, no solve.
name: dlk-grid — r7739 the eta grids and x0(eta) maps, to refs/ci/r7737_grid

on:
  push:
    branches: [claude/shadow-of-existence-setup-wgcmvt]
    paths:
      - 'computations/beyond_the_wall/r7737_70_dlk_split/LAUNCH_GRID'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  grid:
    if: github.ref == 'refs/heads/claude/shadow-of-existence-setup-wgcmvt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }   # only the last step pushes, and only refs/ci/r7737_grid
    concurrency:
      group: dlk-grid-${{ github.ref }}
      cancel-in-progress: false
    env:
      D: computations/beyond_the_wall/r7737_70_dlk_split
      GRID_DIR: /tmp/r7737/grid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt (PO-64)
      - run: pip install -r requirements-ci.txt
      - name: GRIDSAVE, both arms (seconds)
        run: bash "$D/gridsave.sh" "$GRID_DIR"
      - name: the stored Tier 1 blob's closure, for G3
        run: |
          git fetch origin refs/ci/r7737_xmap
          git show FETCH_HEAD:closure.json > /tmp/r7737/xmap_closure.json
      - name: the grid ref, G1-G3 as refusals
        run: python3 -u "$D/gridref.py" "$GRID_DIR" /tmp/r7737/xmap_closure.json /tmp/r7737/out
      - name: the closures, as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7737_grid_closure
          path: /tmp/r7737/out/closure.json
          if-no-files-found: warn
          retention-days: 30
      - name: and where cc66 can fetch it -- refs/ci/r7737_grid
        if: success()
        shell: bash
        env:
          GIT_AUTHOR_NAME: dlk-grid
          GIT_AUTHOR_EMAIL: dlk-grid@users.noreply.github.com
          GIT_COMMITTER_NAME: dlk-grid
          GIT_COMMITTER_EMAIL: dlk-grid@users.noreply.github.com
        run: |
          set -euo pipefail
          o=/tmp/r7737/out; f=r7737_grid.npz
          test -s "$o/$f"
          echo "runner sha256: $(sha256sum "$o/$f" | cut -d' ' -f1)   (container 546977c4f05f2cff..., reported, not required)"
          b1=$(git hash-object -w "$o/$f"); b2=$(git hash-object -w "$o/closure.json")
          tree=$(printf '100644 blob %s\tclosure.json\n100644 blob %s\t%s\n' "$b2" "$b1" "$f" | git mktree)
          commit=$(git commit-tree "$tree" -m "r7739+70: eta grids and x0(eta) per arm, run ${{ github.run_id }} at ${{ github.sha }}; G1-G3 pass")
          git push -f origin "$commit:refs/ci/r7737_grid"
          echo "fetch it with:  git fetch origin refs/ci/r7737_grid && git show FETCH_HEAD:$f > $f"
