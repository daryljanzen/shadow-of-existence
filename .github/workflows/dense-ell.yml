# ⛭ `r7715` (69) ruled option 1 on `r7713+cc66`'s blocker: the dense-`l` discriminant's remaining three
#   combinations run HERE, one per runner, on the IDENTICAL instrument and grid as the combination
#   already banked in the repository, with the registered `5` sd target unchanged.
#
# ** WHY THIS IS A SEPARATE WORKFLOW AND NOT A TIER OF `gates.yml`. **  Three things, each measured:
#
#   ⒜ `gates.yml` carries `cancel-in-progress`, and that is RIGHT for a gate suite -- a verdict about a
#      superseded tree is worth nothing.  It is fatal here: these jobs run about an hour each, and the
#      next push to this branch would kill them, which is precisely the failure that made the
#      in-container route unworkable in the first place.  So this workflow takes its own concurrency
#      group PER COMBINATION and does NOT cancel.
#   ⒝ `r7715`: keep it out of the heavy tier and its budget.  A separate workflow has its own budget
#      line and cannot be charged to the nightly's.
#   ⒞ The trigger is a PUSH PATH FILTER on a launch file, so it fires from the working branch without
#      waiting for a merge.  Nobody waits on the coordinating seat to start a computation.
#
# ⛔ THE CONTROL IS NOT OPTIONAL AND IS NOT A WARNING.  Each job first recomputes the FIRST BLOCK of the
#   already-banked combination on its own runner and refuses, nonzero, unless it agrees to `1e-12`.  All
#   three combinations are read as ratios AGAINST the banked one, so an arithmetic difference between
#   this runner and the container would enter every ratio as though it were physics, and -- because the
#   denominator is shared -- would not cancel anywhere.  See `ci_one_combination.py`'s own header.
name: dense-ell — r7713 the three remaining combinations, one per runner

on:
  push:
    branches-ignore: [main]   # r7717 (69): the merge of this file onto main must not relaunch three hour-long jobs
    paths:
      - 'computations/beyond_the_wall/r7713_cc66_the_dense_ell_discriminant/LAUNCH'
      - '.github/workflows/dense-ell.yml'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  combination:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # measured ~1.05 compute-hours per combination; the job limit is 6 h
    permissions: { contents: write }   # PO-65: the record step pushes refs/ci/dense_ell/*, and nothing else
    strategy:
      fail-fast: false            # one runner's refused control must not hide the other two's results
      matrix:
        include:
          - { src: lcdm, ker: cr,   tag: lcdm_cr }
          - { src: cr,   ker: lcdm, tag: cr_lcdm }
          - { src: cr,   ker: cr,   tag: cr_cr }
    concurrency:
      # ⛔ per combination, and NEVER cancel-in-progress: see ⒜ above.
      group: dense-ell-${{ github.ref }}-${{ matrix.tag }}
      cancel-in-progress: false
    env:
      DENSE_SRC: ${{ matrix.src }}
      DENSE_KER: ${{ matrix.ker }}
      D: computations/beyond_the_wall/r7713_cc66_the_dense_ell_discriminant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11.16' }   # pinned with requirements-ci.txt and ENV_FINGERPRINT.txt (PO-64)
      # ⛭ the PINNED set, not a bare `pip install numpy scipy`: the control compares this runner's
      #   arithmetic against the container's, and a floating version would make that comparison a
      #   measurement of two library versions rather than of two machines.
      - run: pip install -r requirements-ci.txt
      # ⌗ AND THE ONE THING THE PINS DO NOT COVER, said out loud: the container that computed the banked
      #   combination runs interpreter 3.11.17 against this job's pinned 3.11.16, while numpy and scipy
      #   match the pins exactly.  That patch difference is small and is NOT assumed harmless -- the
      #   control below is what measures whether it reaches the kernel, and it is the reason the control
      #   is a refusal rather than a formality.
      - name: the control, then the combination
        run: python3 -u "$D/ci_one_combination.py"
      - name: the assembled spectrum, as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pseudo__S_${{ matrix.src }}__K_${{ matrix.ker }}
          path: ${{ env.D }}/pseudo/pseudo__S_${{ matrix.src }}__K_${{ matrix.ker }}.npz
          if-no-files-found: error
          retention-days: 30
      - name: and where the seat can fetch it — refs/ci/dense_ell/${{ matrix.tag }}
        if: success()
        shell: bash
        env:
          GIT_AUTHOR_NAME: dense-ell
          GIT_AUTHOR_EMAIL: dense-ell@users.noreply.github.com
          GIT_COMMITTER_NAME: dense-ell
          GIT_COMMITTER_EMAIL: dense-ell@users.noreply.github.com
        run: |
          set -euo pipefail
          f="$D/pseudo/pseudo__S_${DENSE_SRC}__K_${DENSE_KER}.npz"
          test -s "$f"
          blob=$(git hash-object -w "$f")
          name="pseudo__S_${DENSE_SRC}__K_${DENSE_KER}.npz"
          tree=$(printf '100644 blob %s\t%s\n' "$blob" "$name" | git mktree)
          commit=$(git commit-tree "$tree" -m "r7713 dense-l: S=${DENSE_SRC} K=${DENSE_KER}, run ${{ github.run_id }} at ${{ github.sha }}")
          git push -f origin "$commit:refs/ci/dense_ell/${{ matrix.tag }}"
          echo "fetch it with:  git fetch origin refs/ci/dense_ell/${{ matrix.tag }} && git show FETCH_HEAD:${name} > ${name}"
