# r7265+71 (node 71): the formalisation seat's gate for computations/formalisation/lean/.
# Path-scoped by design: it runs ONLY on pushes that touch that project, never on the
# corpus's ordinary pushes, and its placement is decided from the runner time it prints
# (pre-registered at computations/formalisation/r7265_71_sinh_law/PREDICTION.md ②; over
# 15 minutes moves it to a schedule).  It reads check_no_sorry.py's verdict, whose gate
# zero is a planted sorry, so a green here can fail.
name: formalisation — lean (Lean, check_no_sorry)

on:
  push:
    paths:
      - 'computations/formalisation/lean/**'
      - '.github/workflows/formalisation-mathlib.yml'
  pull_request:
    paths:
      - 'computations/formalisation/lean/**'
      - '.github/workflows/formalisation-mathlib.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: write }   # PO-65 / r7423 ③: the record step pushes refs/ci/lean/formalisation-mathlib, and nothing else
    defaults:
      run:
        working-directory: computations/formalisation/lean
    steps:
      - uses: actions/checkout@v4
      - name: install elan (toolchain from lean-toolchain)
        run: |
          t0=$(date +%s)
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "TIMING elan: $(( $(date +%s) - t0 ))s"
      - name: fetch dependencies and the mathlib cache
        run: |
          t0=$(date +%s)
          lake exe cache get
          echo "TIMING cache: $(( $(date +%s) - t0 ))s"
      - name: build and read every theorem's axioms
        run: |
          t0=$(date +%s)
          python3 $GITHUB_WORKSPACE/computations/formalisation/lean/check_no_sorry.py "$PWD"
          echo "TIMING build+check: $(( $(date +%s) - t0 ))s"
      # ⛭ r7423 ③ (66), built r7423+70: the verdict where every seat can read it -- refs/ci/lean/formalisation-mathlib.
      #   A record of this run's conclusion keyed by the objects at every path in `push: paths:` above
      #   (this file included), so `python3 scripts/lean_record.py --status` answers "is this tree's
      #   project under a GREEN run" with a fetch and no API.  push runs only: a pull_request run builds
      #   the merge ref but reports the PR head (r7419+70.2's stated limit).
      - name: record — refs/ci/lean/formalisation-mathlib
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GIT_AUTHOR_NAME: gates
          GIT_AUTHOR_EMAIL: gates@users.noreply.github.com
          GIT_COMMITTER_NAME: gates
          GIT_COMMITTER_EMAIL: gates@users.noreply.github.com
        run: python3 scripts/lean_record.py --write formalisation-mathlib --conclusion "${{ job.status }}" --run "${{ github.run_id }}" --event "${{ github.event_name }}"
