# Publishes the live edition to GitHub Pages, rebuilt from source on every push.
#
# ** WHY PAGES AND NOT THE CDN, since the PDFs are served from the CDN and this
#    could have been.**  jsDelivr caches a branch URL for twelve hours at the
#    edge and seven days in a browser.  That is right for the papers, which
#    change rarely and whose content is not a claim about *now*.  It is wrong for
#    the open edge, whose whole point is that it says what is currently open: a
#    reader served a half-day-old frontier is reading a claim the register has
#    already moved past, and would have no way to know.  Pages serves the
#    repository with no such lag.
#
# ** AND THE PAGES ARE REBUILT HERE RATHER THAN READ FROM THE COMMIT. **  The
#    generator runs against the tree being published, so the index, the
#    introduction and the frontier cannot be stale relative to the papers and
#    the register they are generated from -- the same reason the corpus
#    regenerates its appendices rather than hand-maintaining them.
name: pages

on:
  push:
    branches: [main]
    # Any of these can change what the pages say.
    paths:
      - 'INTRODUCTION.md'
      - 'EXPLAINER.md'
      - 'THE_FRONTIER.md'
      - 'THE_REGISTER.md'
      - 'corpus/ledgers_registry.md'
      - 'receipts/INDEX.md'
      - 'corpus/**.tex'
      - 'corpus/**.pdf'
      - 'BOOK_INTRO_cosmiCave/assets/**'
      # r7433: the formalisation page's four inputs.  They were missing, which
      # is the SAME defect as the one below it in the file and found while
      # repairing that one: `r7425` taught the generator to read these and did
      # not teach the trigger, so 71 could close a row, push a new ROWS.tsv,
      # and the published page would keep saying what it said before.  A
      # generator's input list and a trigger's path list are two copies of one
      # thing; these cannot be derived from the generator the way PAGES.txt is,
      # so they are named here and this comment is why.
      - 'computations/formalisation/r7325_71_inventory/ROWS.tsv'
      - 'computations/beyond_the_wall/r7419_69_status_wording/**'
      - 'scripts/decl_cells.py'
      - 'scripts/gen_live_edition.py'
      - 'scripts/gen_paper_html.py'
      - 'scripts/gen_explainer_pdf.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# r4623: rebuilt after the measurement id was corrected to the book stream.

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a queued run supersedes a waiting one rather than
# racing it.  In-progress runs are NOT cancelled: a half-published site is worse
# than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the frontier from the register
        # THE_FRONTIER.md is generated from THE_REGISTER.md.  Regenerating here
        # means a register edit that reached main without its regeneration
        # cannot publish a stale open edge.
        run: python3 scripts/regen_frontier.py

      - name: Build the chapters
        # Same-origin PDFs and figures, so downloads are counted rather than
        # showing up as outbound clicks to a CDN.  ANALYTICS_ID is a repository
        # variable: unset, the pages carry no tracking at all.
        env:
          PDF_BASE: ./pdf
          FIG_BASE: ./fig
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
        run: |
          for p in P1 P2 P3 P4 P5 P6 P7 P8 P9 P10 P11 P12 P13 P14 P15 P16 P17 P18; do
            python3 scripts/gen_paper_html.py "$p"
          done

      - name: Build the pages
        env:
          PDF_BASE: ./pdf
          ANALYTICS_ID: ${{ vars.ANALYTICS_ID }}
        run: python3 scripts/gen_live_edition.py

      - name: Print the explainer's PDF
        # Printed from the page just generated, so the PDF and the page cannot
        # disagree.  The runner carries Chrome; if printing ever fails, the copy
        # committed with the source is published instead of a broken link.
        run: |
          bash scripts/gen_explainer_pdf.sh \
            || echo "::warning::explainer PDF not printed; publishing the committed copy"

      - name: Check the build produced what it claims
        # A publish step that cannot fail is a publish step that will one day
        # ship an empty page.  These are the three assertions worth making.
        #
        # ** THE LIST IS READ FROM THE BUILD, NOT KEPT HERE. **  This step and
        #    the assemble step below each carried their own copy of the page
        #    list.  `r7425` added `formalisation.html` to the generator, the
        #    index nav and the sitemap, and could not add it to two lists it
        #    does not contain -- so the page was built, linked and sitemapped
        #    while the deploy never copied it, and the site answered 404 at a
        #    URL its own sitemap advertised.  `PAGES.txt` is written by the
        #    generator from the single list the sitemap is built from, with
        #    every entry stat'd, and both steps now read it.
        run: |
          set -e
          cd BOOK_INTRO_cosmiCave
          test -s PAGES.txt || { echo "::error::PAGES.txt missing or empty"; exit 1; }
          while read -r f; do
            [ -n "$f" ] || continue
            test -s "$f" || { echo "::error::$f is named in PAGES.txt and is missing or empty"; exit 1; }
          done < PAGES.txt
          echo "PAGES.txt names $(grep -c . PAGES.txt) pages, all present and non-empty."
          grep -q 'The Shadow of Existence' live_edition.html \
            || { echo "::error::index lost its title"; exit 1; }
          grep -qE 'class="pn">P18<' live_edition.html \
            || { echo "::error::index is missing chapters"; exit 1; }
          echo "index $(wc -c < live_edition.html)b, introduction $(wc -c < introduction.html)b, frontier $(wc -c < frontier.html)b"

      - name: Assemble the site
        run: |
          set -e
          mkdir -p _site
          # Every page the generator wrote, read from its own manifest.  A `cp`
          # list kept here is a copy of a list, and a copy is a claim about the
          # list at the moment it was copied -- which is exactly how
          # `formalisation.html` came to be built, linked and sitemapped while
          # this step quietly shipped a site without it.  Nothing is globbed
          # either: `paper_P*.html` would have shipped a stale chapter whose
          # source had been deleted.
          while read -r f; do
            [ -n "$f" ] || continue
            cp "BOOK_INTRO_cosmiCave/$f" _site/
          done < BOOK_INTRO_cosmiCave/PAGES.txt
          # index.html is the live edition, so the site root is the book.
          cp BOOK_INTRO_cosmiCave/live_edition.html _site/index.html
          cp BOOK_INTRO_cosmiCave/sitemap.xml _site/ 2>/dev/null || true
          cp BOOK_INTRO_cosmiCave/robots.txt _site/ 2>/dev/null || true
          # ** The custom domain must be IN THE ARTIFACT. **  We deploy from
          # Actions rather than from a branch, so a CNAME that exists only in
          # the repository root or only in Settings is not part of what gets
          # published -- and a later deploy silently detaches the domain.
          # Written here, every deploy carries it.
          echo 'shadow.cosmicave.org' > _site/CNAME
          mkdir -p _site/pdf _site/fig _site/fig/figs _site/fig/figures _site/assets
          cp corpus/*.pdf _site/pdf/ 2>/dev/null || true
          cp BOOK_INTRO_cosmiCave/explainer.pdf _site/pdf/ 2>/dev/null || true
          cp corpus/*.png _site/fig/ 2>/dev/null || true
          cp corpus/figs/*.png _site/fig/figs/ 2>/dev/null || true
          cp corpus/figures/*.png _site/fig/figures/ 2>/dev/null || true
          # r7207: the TikZ drawings are compiled to SVG by scripts/render_tikz.py
          # and live beside the pages rather than in corpus/, so they need their own
          # copy -- without it the figure element ships with a dangling src and the
          # caption is back to describing a picture that is not there.
          cp BOOK_INTRO_cosmiCave/fig/*.svg _site/fig/ 2>/dev/null || true
          # Three figures are referenced from outside corpus/, by a relative
          # path that climbs out of it; mirrored so those links resolve.
          mkdir -p _site/resources/PhD_thesis
          cp resources/PhD_thesis/*.png _site/resources/PhD_thesis/ \
            2>/dev/null || true
          cp BOOK_INTRO_cosmiCave/assets/*.html _site/assets/ 2>/dev/null || true
          # The index reads the frontier at page load; served from the site so
          # nothing on the page depends on a third party.
          cp THE_FRONTIER.md _site/ 2>/dev/null || true

      - name: Every advertised url resolves in the assembled site
        # ** THE ONE CHECK THAT RUNS ON `_site`. **  Everything above asks its
        #   question of `BOOK_INTRO_cosmiCave/`, which is the directory that was
        #   green through the ten hours `formalisation.html` answered 404.  This
        #   runs AFTER the `|| true` copies, on the bytes that get uploaded, and
        #   asserts the sitemap's own presence first so it cannot pass vacuously.
        #   Built to `cc66`'s r7433 price, which measured the result before the
        #   gate existed: it finds nothing today, and what it buys is that the
        #   sitemap and the deploy are compared as ARTIFACTS rather than trusted
        #   to share an origin in the generator's code.
        run: python3 corpus/check_sitemap_resolves.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
