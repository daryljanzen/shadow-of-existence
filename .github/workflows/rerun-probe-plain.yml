# TEMPORARY -- r7429+70 ② experiment (node 70); deleted before the PR merges.  See
# computations/beyond_the_wall/r7429_70_rerun_guard/PREDICTION.md.
name: rerun-probe-plain (r7429 temporary)
on:
  push:
    branches: ['claude/shadow-of-existence-setup-wgcmvt']
    paths: ['computations/beyond_the_wall/r7429_70_rerun_guard/trigger.txt']
concurrency:
  group: ${{ format('probe-plain-{0}', github.ref) }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: identify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api repos/${{ github.repository }}/git/ref/heads/${{ github.ref_name }} --jq .object.sha)
          echo "PROBE plain sha=${{ github.sha }} attempt=${{ github.run_attempt }} run=${{ github.run_id }} tip=$tip"
          if [ "$tip" = "${{ github.sha }}" ]; then echo "GUARD: HEAD"; else echo "GUARD: STALE -- this run's commit is not the branch tip; a record step would file nothing"; fi
      - name: hold the slot
        run: sleep 240
